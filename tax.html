<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#fff4e8">
  <title>計下要交幾多稅 · AIA</title>
  <link rel="stylesheet" href="fonts.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            paper: "#fff4e8",
            ink: "#2a211c",
            clay: "#c0562a",
            leaf: "#2d6a4f",
            line: "#f0e2d2",
          },
          fontFamily: {
            sans: ["PingFang TC", "Microsoft JhengHei", "Noto Sans TC", "sans-serif"],
          },
          boxShadow: {
            card: "0 12px 30px rgba(120, 70, 30, 0.08)",
          },
        },
      },
    };
  </script>
  <style>
    body { margin: 0; background: #fff4e8; color: #2a211c; font-family: "PingFang TC", "Microsoft JhengHei", sans-serif; }
    button, input { font: inherit; }
  </style>
</head>
<body class="min-h-dvh bg-paper text-ink font-sans text-lg leading-relaxed">
  <header class="mx-auto flex w-full max-w-lg items-center justify-between px-4 pb-2 pt-5">
    <div>
      <p class="text-sm font-extrabold tracking-wide text-clay">AIA</p>
      <h1 class="text-2xl font-extrabold leading-tight">計下要交幾多稅</h1>
    </div>
    <a class="text-base font-extrabold text-clay no-underline" href="admin.html">後台</a>
  </header>
  <main id="app" class="mx-auto w-full max-w-lg px-4 pb-16"></main>
  <div id="explain" class="fixed inset-0 z-20 hidden items-end justify-center bg-ink/45 p-3 sm:items-center" hidden>
    <div class="w-full max-w-lg rounded-3xl bg-white p-5 shadow-card" role="dialog" aria-modal="true" aria-labelledby="explain-title">
      <h2 id="explain-title" class="text-2xl font-extrabold leading-snug"></h2>
      <div id="explain-body" class="mt-3 space-y-3 text-lg"></div>
      <button type="button" id="explain-close" class="mt-5 h-14 w-full rounded-2xl bg-clay text-lg font-extrabold text-white">明白了</button>
    </div>
  </div>
  <script type="module" src="tax/app.js"></script>
</body>
</html>
