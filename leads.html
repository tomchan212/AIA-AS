<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>冷電名單 · AIA</title>
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="leads.css">
</head>
<body class="leads-page">
  <header class="leads-top">
    <div>
      <p class="leads-kicker">AIA</p>
      <h1>冷電名單</h1>
      <p>打陌生電話之前唔知對方姓名。打完之後，先由你自己填姓名同 remarks。新增時只記錄你打過的號碼，不會自動編名。</p>
    </div>
    <a class="leads-link" href="admin.html">返回後台</a>
  </header>
  <main class="leads-main">
    <section class="leads-card">
      <h2>新增這通電話</h2>
      <form id="add-form">
        <label>你打過的號碼
          <input id="lead-number" type="tel" inputmode="numeric" placeholder="9123 4567" autocomplete="off">
        </label>
        <button type="submit" class="leads-primary">新增</button>
      </form>
    </section>
    <section class="leads-card">
      <h2>更新狀態</h2>
      <form id="command-form">
        <input id="command-input" type="text" placeholder="將張偉成的 status 改為 accept" autocomplete="off">
        <button type="submit" class="leads-primary">更新</button>
      </form>
      <p id="command-msg" role="status"></p>
    </section>
    <section class="leads-card">
      <h2>名單</h2>
      <div id="lead-table"></div>
    </section>
    <section class="leads-card">
      <h2>Markdown</h2>
      <pre id="lead-markdown"></pre>
    </section>
  </main>
  <script type="module" src="leads/app.js"></script>
</body>
</html>
